<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Running tests...</title>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --pass: #0a6b2e; --fail: #b00020; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --pass: #6fdc8c; --fail: #ff8a80; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  #summary { font-weight: 700; font-size: 18px; margin: 8px 0 16px; }
  #summary[data-result="pass"] { color: var(--pass); }
  #summary[data-result="fail"] { color: var(--fail); }
  ul { list-style: none; padding: 0; margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  li { padding: 2px 0; overflow-wrap: anywhere; }
  li.pass { color: var(--pass); }
  li.fail { color: var(--fail); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Then What?! tests</h1>
  <p>Engine tests (DRD v1.1 §10.1 items 1–3) and content checks (item 4). No network, nothing to install.</p>
  <p id="mode">Full mode: Twist simulations use 10,000 games (DRD §10.1). Add ?quick for 500.</p>
  <p id="summary" role="status">Running...</p>
  <ul id="results"></ul>
</main>
<!-- Content and its checks load first; a 404 for either is fine (the tests say so). -->
<script src="js/content.js"></script>
<script src="js/tests-content.js"></script>
<script src="js/engine.js"></script>
<script src="js/tests.js"></script>
</body>
</html>
